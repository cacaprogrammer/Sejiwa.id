<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Halaman Login</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      max-width: 1000px;
      width: 100%;
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      overflow: hidden;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* === Bagian Selamat Datang === */
body {
  font-family: "Poppins", sans-serif;
}
.welcome {
  display: flex;
  align-items: center;       
  justify-content: center;   
  gap: 10px;                 
  margin-bottom: 25px;
}

.welcome i {
  font-size: 20px;
  color: #000;
}

.welcome h2 {
  font-size: 20px;
  font-weight: 700;
  color: #000;
  margin: 0;
}

    /* Kiri */
    .left {
      flex: 1;
      background-color: #ffffff;
      background-image: url("login1.png");
      background-repeat: no-repeat;
      background-position: 35px center;
      background-size: 415px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .left img {
      width: 100%;
      max-width: 400px;
    }

    /* Kanan */
    .right {
      flex: 1;
      padding: 50px 60px;
    }

    .right h2 {
      font-size: 24px;
      font-weight: 600;
      color: #2e2e2e;
      margin-bottom: 30px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .input-group {
      display: flex;
      align-items: center;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 25px;
      height: 55px; 
    }

    /* Kotak ikon di kiri */
    .icon-box {
      background-color: #e8d2c1; 
      width: 60px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top-left-radius: 15px;
      border-bottom-left-radius: 15px;
    }

    .icon-box i {
      color: #000; 
      font-size: 20px;
    }

/* Field input di kanan */
    .input-group input {
      flex: 1;
      background-color: #603a2b; 
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-family: "Poppins", sans-serif;
      padding: 0 15px;
      height: 100%;
      border-top-right-radius: 15px;
      border-bottom-right-radius: 15px;
    }

    .input-group input::placeholder {
      color: #fff;
      opacity: 0.9;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .options a {
      color: #000;
      text-decoration: none;
      font-weight: 500;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #603a2b;
      color: #fff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #4c2e21;
      transform: scale(1.02);
    }
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 30px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 2px solid #000000; 
      margin: 0 15px; 
      opacity: 0.5; 
    }

    .divider span {
      color: #000000;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .social-login {
      display: flex;
      justify-content: center;
      gap: 25px;
    }

    .social-login img {
      width: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    .social-login img:hover {
      transform: scale(1.1);
    }

    /* Responsif untuk HP */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 90%;
      }

      .left {
        display: none;
      }

      .right {
        padding: 40px 30px;
      }
    }
  </style>
  </head>
   <body>
  <div class="container">
  <div class="left">
  </div>

  <div class="right">
  <div class="welcome">
    <img src="ri_admin-fill.png" alt="icon"> 
    <h3>Selamat Datang!</h3>
  </div>
    <form>
    <label for="email">Email</label>
  <div class="input-group">
  <div class="icon-box">
    <img src="Vector.png">
  </div>
    <input type="email" id="email" placeholder="Masukkan Email" required>
  </div>
    <label for="password">Kata Sandi</label>
  <div class="input-group">
  <div class="icon-box">
    <img src="Vector (1).png"> 
  </div>
    <input type="password" id="password" placeholder="Masukkan Kata Sandi" required>
  </div>

  <div class="options">
    <label><input type="checkbox"> Ingatkan Saya</label>
    <a href="register.html">Belum Punya Akun?</a>
  </div>

        <a href="landingpagepilihanfix.html" class="btn" style="text-decoration: none; display: block; text-align: center; 
        display: block; padding: 10px 0;">
        Masuk</a>

        

        <div class="divider">
          <span>Atau Masuk Dengan</span>
        </div>

        <div class="social-login">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/apple/apple-original.svg" alt="Apple">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg" alt="Facebook">
        </div>
      </form>
    </div>
  </div>
</body>
</html>
