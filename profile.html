<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> Profile - Sejiwa.id</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* RESET */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    /* BODY / LAYOUT */
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #ffffff;
      overflow-x: hidden;
    }

    /* SIDEBAR MIRIP FIGMA */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 240px;
  height: 100vh;
  background: #4a2c18; 
  padding: 30px 25px;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  transition: transform 0.35s ease-in-out;
  z-index: 1000;
}

/* LOGO */
.sidebar-logo {
  width: 55px;
  margin-bottom: 50px;
}

/* MENU */
.sidebar a {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 15px; 
  font-size: 16px;
  color: white;
  text-decoration: none;
  padding: 14px 5px;
  margin: 2px 0;
  border-radius: 10px;
}

/* ICON */
.sidebar a i {
  font-size: 20px;
}
.icon-menu {
  width: 20px;          
  height: 20px;
  object-fit: contain;  
  margin-right: 14px;   
}

/* ACTIVE & HOVER */
.sidebar a.active {
  background: rgba(255,255,255,0.15);
}
.sidebar a:hover {
  background: rgba(255,255,255,0.12);
}

/* HAMBURGER MENU */
.hamburger {
  display: none;
  position: fixed;
  top: 32px;
  right: 26px;  
  font-size: 28px;
  color: #4a2c18;
  cursor: pointer;
  z-index: 1100;
}

/* MAIN WRAPPER */
.main-wrapper {
  margin-left: 230px;     
  flex: 1;                
  display: flex;
  flex-direction: column;
  transition: margin-left 0.35s ease;
}

/* CONTENT AREA */
.content {
  padding: 30px 40px;
}

.profile-header {
  background: #fff;
  padding: 18px 22px;
  border-radius: 10px;
  box-shadow: 0 0 7px rgba(0,0,0,0.12);
  margin-bottom: 30px;
}
.profile-header h3 { font-size: 19px; color:#333; font-weight:600; }

/* EDIT CARD */
.edit-container {
  background: #fff;
  padding: 30px 35px;
  border-radius: 12px;
  max-width: 720px;
  box-shadow: 0 0 10px rgba(0,0,0,0.08);
  margin-bottom: 40px;
}
.edit-title { font-size:20px; margin-bottom:18px; color:#333; font-weight:600; }
.form-group { margin-bottom:14px; }
label { display:block; font-size:14px; margin-bottom:6px; color:#333; }
input, select {
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:14px;
  background:#fff;
}
input:focus, select:focus { outline:none; border-color:#8b3e26; box-shadow: 0 0 0 3px rgba(139,62,38,0.07); }

.row { display:flex; gap:16px; }
.col { flex:1; }

.actions { display:flex; gap:12px; justify-content:flex-end; margin-top:18px; }
.btn { padding:10px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
.btn-secondary { background:#fff; border:1px solid #ccc; color:#333; }
.btn-primary { background:#5a2f1f; color:#fff; }

/* HISTORY BOX (opsional) */
.history-box {
  background:#fff; padding:22px; border-radius:10px; box-shadow:0 0 8px rgba(0,0,0,0.06);
  max-width: 980px;
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .hamburger {
    display: block;
  }
  .sidebar {
    transform: translateX(-100%);
    position: fixed;
    width: 240px;
  }
  .sidebar.show {
    transform: translateX(0);
  }
  .main-wrapper {
    margin-left: 0; 
  }
  .content { margin-left: 0; padding: 20px; }
}
  </style>
</head>
<body>

  <!-- HAMBURGER -->
  <div class="hamburger" id="hamburger">
    <i class="fas fa-bars"></i>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <img src="logobenar.png" class="sidebar-logo">

    <a href="#" class="active">
      <img src="iconamoon_profile.png" class="icon-menu"> Profil
    </a>

    <a href="#">
      <img src="Group.png" class="icon-menu"> Keluar
    </a>
  </div>

  <!-- MAIN WRAPPER -->
  <div class="main-wrapper">
    <main class="content">
      <div class="profile-header">
        <h3>Edit Profile</h3>
      </div>

      <section class="edit-container" aria-label="form ubah profil">
        <div class="edit-title">Edit Profil</div>

        <div style="display:flex; align-items:center; gap:18px; margin-bottom:18px;">
          <img src="https://i.pravatar.cc/160" alt="avatar" style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #ddd;">
          <div>
            <div style="font-weight:700;font-size:18px;color:#333;">Jacob Jones</div>
            <div style="color:#666;margin-top:6px;">@Jacob.Jones</div>
            <button class="btn" style="margin-top:8px;background:#8b3e26;color:#fff;border-radius:8px;padding:8px 12px;">Ubah Profil</button>
          </div>
        </div>

        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" value="Jacob Jones">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" value="JacobJones@gmail.com">
        </div>

        <div class="form-group">
          <label>Kata Sandi</label>
          <input type="password" value="password123">
        </div>

        <div class="row" style="margin-top:8px;">
          <div class="col form-group">
            <label>Negara</label>
            <select>
              <option>Indonesia</option>
              <option>China</option>
              <option>Malaysia</option>
            </select>
          </div>
          <div class="col form-group">
            <label>Kota</label>
            <select>
              <option>Jakarta</option>
              <option>Shanghai</option>
              <option>Bandung</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-secondary">Kembali</button>
          <button class="btn btn-primary">Simpan Perubahan</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const hamburger = document.getElementById("hamburger");
    const sidebar = document.getElementById("sidebar");

    hamburger.addEventListener("click", () => {
      sidebar.classList.toggle("show");
    });
  </script>

</body>
</html>
